name: Publier le coach sur GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    env:
      # Electron ne sert que pour l'application de bureau : inutile de
      # telecharger ses 100 Mo de binaire pour compiler la version web.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler
        run: npm run build

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le résultat compilé
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: compiler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
